name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  export-android:
    name: Export APK
    runs-on: ubuntu-22.04
    env:
      GODOT_VERSION: "4.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Godot 4.3 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Godot for Android
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          godot --headless --editor --quit || true
          godot --headless --import || true
          SETTINGS=~/.config/godot/editor_settings-${GODOT_VERSION}.tres
          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> $SETTINGS
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> $SETTINGS
          echo "export/android/debug_keystore = \"$HOME/debug.keystore\"" >> $SETTINGS
          echo "export/android/debug_keystore_user = \"androiddebugkey\"" >> $SETTINGS
          echo "export/android/debug_keystore_pass = \"android\"" >> $SETTINGS
          echo "export/android/force_system_user = false" >> $SETTINGS
          echo "export/android/shutdown_adb_on_exit = true" >> $SETTINGS
          echo "JAVA_HOME=$JAVA_HOME  ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/build-tools $ANDROID_HOME/platforms $ANDROID_HOME/cmdline-tools || true
          echo "---- templates"
          ls -R ~/.local/share/godot/export_templates | head -30 || true
          echo "---- android settings"
          grep export/android $SETTINGS || true

      - name: Export APK
        run: |
          mkdir -v -p build
          godot --headless --verbose --export-debug "Android" build/RestaurantAdventure.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RestaurantAdventure-apk
          path: build/RestaurantAdventure.apk
